<div class="app-shell">
	<app-header
		*ngIf="show !== 'login' && show !== 'register'"
		[activeView]="show"
		(navigate)="setView($event)"
	></app-header>
	<main class="app-shell__content" [class.app-shell__content--auth]="show === 'login' || show === 'register'" role="main" aria-live="polite">
		<app-landing *ngIf="show === 'landing'" (switchView)="setView($event)"></app-landing>
		<app-home *ngIf="show === 'home'"></app-home>
		<div *ngIf="show === 'login'" class="auth-wrapper">
			<app-login (switchView)="setView($event)"></app-login>
		</div>
		<div *ngIf="show === 'register'" class="auth-wrapper">
			<app-register (switchView)="setView($event)"></app-register>
		</div>
	</main>
	<app-footer *ngIf="show !== 'login' && show !== 'register'"></app-footer>
</div>
