<div class="max-w-md mx-auto mt-12">
	<div class="card-enhanced p-8 hover-lift">
		<h1 class="text-3xl font-bold text-center mb-8 text-gray-800">Registro de Usuario</h1>

		<form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
			<div *ngIf="errorMessage" class="mb-4 p-3 rounded bg-red-100 text-red-800">{{ errorMessage }}</div>
			<div *ngIf="successMessage" class="mb-4 p-3 rounded bg-green-100 text-green-800">{{ successMessage }}</div>

			<!-- Nombre -->
			<div class="mb-6">
				<label class="block text-gray-700 font-semibold mb-2">Nombre Completo</label>
				<input type="text" formControlName="name" placeholder="Tu nombre completo" class="w-full border rounded-lg px-4 py-3" />
			</div>

			<!-- Email -->
			<div class="mb-6">
				<label class="block text-gray-700 font-semibold mb-2">Correo Electrónico</label>
				<input type="email" formControlName="email" placeholder="ejemplo@correo.com" class="w-full border rounded-lg px-4 py-3" />
			</div>

			<!-- Password -->
			<div class="mb-8 relative">
				<label class="block text-gray-700 font-semibold mb-2">Contraseña</label>
				<input [type]="showPassword ? 'text' : 'password'" formControlName="password" placeholder="Mínimo 8 caracteres" class="w-full border rounded-lg px-4 py-3 pr-12" />
				<button type="button" class="absolute right-3 top-3 text-gray-500" (click)="togglePassword()" aria-label="Mostrar u ocultar contraseña">
					<i class="fas" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
				</button>
				<p class="text-sm text-gray-500 mt-1">Mínimo 8 caracteres</p>
			</div>

			<!-- Tipo de Usuario como tarjetas -->
			<div class="mb-8">
				<label class="block text-gray-700 font-semibold mb-4">Tipo de Usuario</label>
				<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
					<div class="user-type-card cursor-pointer" [ngClass]="{ 'selected': registerForm.value.type === 'unemployed' }" (click)="selectType('unemployed')">
						<div class="border-2 rounded-xl p-6 h-48 flex items-center" [ngClass]="registerForm.value.type === 'unemployed' ? 'border-blue-600 bg-blue-100' : 'border-gray-300 bg-white'">
							<div class="w-full text-center">
								<div class="w-12 h-12 mx-auto mb-3 bg-blue-100 rounded-full flex items-center justify-center"><i class="fas fa-user text-blue-600"></i></div>
								<h3 class="text-lg font-semibold text-gray-800 mb-2">Cesante</h3>
								<p class="text-sm text-gray-600">Busco oportunidades laborales y capacitaciones profesionales</p>
							</div>
						</div>
					</div>
					<div class="user-type-card cursor-pointer" [ngClass]="{ 'selected': registerForm.value.type === 'company' }" (click)="selectType('company')">
						<div class="border-2 rounded-xl p-6 h-48 flex items-center" [ngClass]="registerForm.value.type === 'company' ? 'border-green-600 bg-green-100' : 'border-gray-300 bg-white'">
							<div class="w-full text-center">
								<div class="w-12 h-12 mx-auto mb-3 bg-green-100 rounded-full flex items-center justify-center"><i class="fas fa-building text-green-600"></i></div>
								<h3 class="text-lg font-semibold text-gray-800 mb-2">Empresa</h3>
								<p class="text-sm text-gray-600">Publico ofertas laborales, busco talento calificado y gestiono procesos de reclutamiento</p>
							</div>
						</div>
					</div>
				</div>
			</div>

			<button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg shadow-md">Registrarse</button>

			<p class="mt-6 text-center text-gray-600">¿Ya tienes una cuenta? <a routerLink="/login" class="text-blue-600 hover:underline font-medium">Inicia sesión</a></p>
		</form>
	</div>
</div>
